<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forfaits eSIM Airalo</title>
    <style>
      *{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#fff;font-family:Arial,sans-serif}body{padding:2px}tp-cascoon{display:block;min-height:345px;overflow:visible}.fallback{display:none;min-height:345px;align-items:center;justify-content:center;padding:28px;text-align:center;background:linear-gradient(135deg,#fff,#f7f5ff)}.fallback.visible{display:flex}.fallback div{max-width:520px}.fallback strong{display:block;color:#07162f;font-size:23px}.fallback p{color:#64748b;font-size:14px}.fallback a{display:inline-flex;min-height:46px;align-items:center;margin-top:8px;padding:0 20px;border-radius:11px;color:#fff;background:#07162f;font-size:13px;font-weight:800;text-decoration:none}
    </style>
  </head>
  <body>
    <div id="fallback" class="fallback">
      <div><strong>Préparez votre eSIM avec Airalo</strong><p>Consultez les forfaits disponibles pour plus de 200 destinations.</p><a href="https://airalo.tpk.lu/uQBzbNMH" target="_blank" rel="nofollow sponsored noopener">Voir les forfaits Airalo</a></div>
    </div>
    <script>
      (function(){
        var fallback=document.getElementById('fallback');
        var ready=false;
        var observer=new MutationObserver(function(){
          if(document.querySelector('tp-cascoon')){ready=true;fallback.classList.remove('visible')}
        });
        observer.observe(document.body,{childList:true,subtree:true});
        window.setTimeout(function(){if(!ready)fallback.classList.add('visible')},8000);
        window.addEventListener('error',function(){if(!ready)fallback.classList.add('visible')});
      })();
    </script>

  </body>
</html>

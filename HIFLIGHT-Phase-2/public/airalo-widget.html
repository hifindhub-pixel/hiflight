<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forfaits eSIM Airalo</title>
    <style>
      *{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#fff;font-family:Arial,sans-serif}body{padding:2px}tp-cascoon{display:block;min-height:360px;overflow:visible}
    </style>
  </head>
  <body>
    <script>
      (function(){
        var announced=false;
        var shadowObserver=null;
        var translations={
          'Local, regional and global eSIMs for travellers':'Des eSIM locales, régionales et mondiales',
          'Stay connected, wherever you travel, at affordable rates':'Restez connecté partout avec un forfait adapté à votre voyage',
          'Search data packs for 200+ countries and regions':'Rechercher parmi plus de 200 pays et régions',
          'Search data packs':'Rechercher des forfaits',
          'Search':'Rechercher',
          'Select a destination':'Sélectionnez une destination',
          'Select your destination':'Sélectionnez votre destination',
          'Popular countries':'Pays populaires',
          'Popular destinations':'Destinations populaires',
          'No results found':'Aucun résultat trouvé',
          'Try another search':'Essayez une autre recherche'
        };
        var translate=function(scope){
          scope.querySelectorAll('*').forEach(function(element){
            if(element.children.length===0){
              var value=(element.textContent||'').trim();
              if(translations[value]) element.textContent=translations[value];
            }
          });
          scope.querySelectorAll('input').forEach(function(input){
            var placeholder=(input.getAttribute('placeholder')||'').trim();
            if(translations[placeholder]) input.setAttribute('placeholder',translations[placeholder]);
            else if(/search data packs/i.test(placeholder)) input.setAttribute('placeholder','Rechercher parmi plus de 200 pays et régions');
            if(input.getAttribute('aria-label')!=='Destination eSIM') input.setAttribute('aria-label','Destination eSIM');
          });
          scope.querySelectorAll('button[type="submit"]').forEach(function(button){
            if(button.getAttribute('aria-label')!=='Rechercher une eSIM') button.setAttribute('aria-label','Rechercher une eSIM');
            var copy=button.querySelector('.form-submit__content');
            if(copy&&copy.textContent!=='Rechercher') copy.textContent='Rechercher';
          });
        };
        var check=function(){
          var component=document.querySelector('tp-cascoon');
          var scope=component&&component.shadowRoot;
          var interactive=scope&&scope.querySelector('form,input,button,select,[role="combobox"]');
          var renderedText=scope&&scope.textContent&&scope.textContent.trim().length>20;
          if(scope){
            translate(scope);
            if(!shadowObserver){
              shadowObserver=new MutationObserver(function(){translate(scope)});
              shadowObserver.observe(scope,{childList:true,subtree:true,characterData:true,attributes:true});
            }
          }
          if(component&&scope&&(interactive||renderedText)&&!announced){
            announced=true;
            component.setAttribute('lang','fr');
            window.parent.postMessage({type:'hiflight:airalo-ready'},'*');
          }
        };
        new MutationObserver(check).observe(document.documentElement,{childList:true,subtree:true});
        window.setInterval(check,400);
      })();
    </script>
    <script async charset="utf-8" src="https://tpwdg.com/content?trs=514265&amp;shmarker=714763&amp;locale=fr&amp;powered_by=false&amp;color_button=%23f2685f&amp;color_focused=%23f2685f&amp;secondary=%23FFFFFF&amp;dark=%2311100f&amp;light=%23FFFFFF&amp;special=%23C4C4C4&amp;border_radius=12&amp;plain=false&amp;no_labels=true&amp;promo_id=8588&amp;campaign_id=541"></script>
  </body>
</html>
